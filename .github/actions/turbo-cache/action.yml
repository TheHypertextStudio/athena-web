name: Authenticate the signed Turbo cache
description: Mint a short-lived Google ID token for trusted Studio main workflows.

inputs:
  workload-identity-provider:
    description: Google Cloud Workload Identity Federation provider supplied by the workflow.
    required: false
    default: ''
  service-account:
    description: Dedicated cache client service account to impersonate.
    required: false
    default: ''
  api:
    description: HTTPS cache service URL and ID token audience.
    required: false
    default: ''
  team:
    description: Namespace within this repository's dedicated cache.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Other refs and incomplete configuration retain the workflow's local-only cache setting.
    # The invoker service account also restricts WIF to this repository's main branch subject.
    - id: auth
      if: >-
        github.repository == 'TheHypertextStudio/athena-web' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
        (github.workflow_ref == 'TheHypertextStudio/athena-web/.github/workflows/ci.yml@refs/heads/main' ||
        github.workflow_ref == 'TheHypertextStudio/athena-web/.github/workflows/e2e.yml@refs/heads/main') &&
        inputs.api != '' && inputs.team != '' &&
        inputs.workload-identity-provider != '' && inputs.service-account != '' &&
        env.TURBO_REMOTE_CACHE_SIGNATURE_KEY != ''
      uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        service_account: ${{ inputs.service-account }}
        token_format: id_token
        id_token_audience: ${{ inputs.api }}
        id_token_include_email: true
        create_credentials_file: false

    - name: Enable the authenticated remote cache
      if: steps.auth.outputs.id_token != ''
      shell: bash
      env:
        CACHE_TOKEN: ${{ steps.auth.outputs.id_token }}
        CACHE_API: ${{ inputs.api }}
        CACHE_TEAM: ${{ inputs.team }}
      run: |
        printf '%s\n' "TURBO_TOKEN=$CACHE_TOKEN" "TURBO_API=$CACHE_API" "TURBO_TEAM=$CACHE_TEAM" 'TURBO_CACHE=local:rw,remote:rw' >> "$GITHUB_ENV"
