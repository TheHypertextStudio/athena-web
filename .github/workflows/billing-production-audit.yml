name: Billing production audit

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Read production billing state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile --filter @docket/root --filter @docket/api...

      - name: Read production billing state
        id: billing-audit
        env:
          API_SECRET_BINDINGS: ${{ vars.API_SECRET_BINDINGS }}
          APP_MODE: production
          BILLING_ENABLED: 'false'
          BILLING_RECONCILIATION_MODE: shadow
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID: ${{ vars.STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID }}
          STRIPE_SINGLE_SUBSCRIPTION_REDIRECT_VERIFIED_AT: ${{ vars.STRIPE_SINGLE_SUBSCRIPTION_REDIRECT_VERIFIED_AT }}
          SKIP_ENV_VALIDATION: '1'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/billing-production-audit"

          read_bound_secret() {
            local env_name="$1"
            local binding
            local secret_name
            local secret_version
            local value
            binding="$(printf '%s\n' "$API_SECRET_BINDINGS" | awk -F'[=:]' -v name="$env_name" '$1 == name { print $2 ":" $3; exit }')"
            if [ -z "$binding" ]; then
              echo "Missing production secret binding for $env_name." >&2
              return 1
            fi
            secret_name="${binding%:*}"
            secret_version="${binding##*:}"
            value="$(gcloud secrets versions access "$secret_version" \
              --secret="$secret_name" --project="$GCP_PROJECT_ID" --quiet)"
            echo "::add-mask::$value"
            declare -gx "$env_name=$value"
          }

          read_bound_secret DATABASE_URL
          read_bound_secret STRIPE_SECRET_KEY

          set +e
          pnpm exec tsx scripts/billing-launch-audit.ts \
            --out "$RUNNER_TEMP/billing-production-audit/billing-launch-audit.json" \
            2>"$RUNNER_TEMP/billing-production-audit/billing-launch-audit.log"
          audit_status=$?
          set -e
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Read failed billing-action diagnostics
        if: always()
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/billing-production-audit"
          filter='resource.type="cloud_run_revision" AND resource.labels.service_name="docket-api" AND (jsonPayload.path:"billing-exemption" OR textPayload:"billing-exemption")'
          gcloud logging read "$filter" \
            --project="$GCP_PROJECT_ID" \
            --freshness=24h \
            --limit=100 \
            --order=desc \
            --format=json \
            | jq '[.[] | {
                timestamp,
                severity,
                requestId: (.jsonPayload.requestId // .labels."run.googleapis.com/execution_name" // null),
                event: (.jsonPayload.event // null),
                method: (.jsonPayload.method // .httpRequest.requestMethod // null),
                path: (.jsonPayload.path // null),
                status: (.httpRequest.status // null),
                message: (.jsonPayload.message // null)
              }]' \
            > "$RUNNER_TEMP/billing-production-audit/billing-provider-errors.json"

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: billing-production-audit
          path: ${{ runner.temp }}/billing-production-audit/
          retention-days: 7
          if-no-files-found: error

      - name: Enforce billing audit result
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.billing-audit.outputs.status }}
        run: test "$AUDIT_STATUS" = 0
