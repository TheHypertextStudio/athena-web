name: Billing production audit

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  audit:
    name: Read production billing state
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: ./.github/actions/setup
        with:
          filter: '--filter @docket/root --filter @docket/api...'

      - name: Verify deployed billing rollout
        env:
          EXPECTED_RECONCILIATION_MODE: ${{ vars.BILLING_RECONCILIATION_MODE }}
          EXPECTED_STRIPE_ACCOUNT_ID: ${{ vars.STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/billing-production-audit"

          case "$EXPECTED_RECONCILIATION_MODE" in
            shadow|active) ;;
            *) echo "Production billing reconciliation must be shadow or active during launch observation." >&2; exit 1 ;;
          esac

          service_json="$(gcloud run services describe docket-api \
            --project="$GCP_PROJECT_ID" \
            --region="$GCP_REGION" \
            --format='json(status.latestReadyRevisionName,status.url,spec.template.spec.containers[0].env)')"
          deployed_checkout="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "BILLING_ENABLED") | .value' <<<"$service_json")"
          deployed_mode="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "BILLING_RECONCILIATION_MODE") | .value' <<<"$service_json")"
          deployed_account="$(jq -r '.spec.template.spec.containers[0].env[] | select(.name == "STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID") | .value' <<<"$service_json")"
          revision="$(jq -r '.status.latestReadyRevisionName' <<<"$service_json")"
          service_url="$(jq -r '.status.url' <<<"$service_json")"

          scheduler_json="$(gcloud scheduler jobs describe docket-billing-reconciliation \
            --project="$GCP_PROJECT_ID" \
            --location="$GCP_REGION" \
            --format='json(name,schedule,state,httpTarget.uri,status,lastAttemptTime)')"
          scheduler_name="$(jq -r '.name' <<<"$scheduler_json")"
          scheduler_schedule="$(jq -r '.schedule' <<<"$scheduler_json")"
          scheduler_state="$(jq -r '.state' <<<"$scheduler_json")"
          scheduler_uri="$(jq -r '.httpTarget.uri' <<<"$scheduler_json")"
          scheduler_last_attempt="$(jq -r '.lastAttemptTime // null' <<<"$scheduler_json")"
          scheduler_status_code="$(jq -r 'if .lastAttemptTime == null then "null" else (.status.code // 0) end' <<<"$scheduler_json")"

          pnpm exec tsx scripts/billing-runtime-rollout.ts \
            --out "$RUNNER_TEMP/billing-production-audit/billing-runtime-rollout.json" \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --revision "$revision" \
            --service-url "$service_url" \
            --checkout-enabled "$deployed_checkout" \
            --reconciliation-mode "$deployed_mode" \
            --expected-reconciliation-mode "$EXPECTED_RECONCILIATION_MODE" \
            --stripe-account-id "$deployed_account" \
            --expected-stripe-account-id "$EXPECTED_STRIPE_ACCOUNT_ID" \
            --scheduler-name "$scheduler_name" \
            --scheduler-schedule "$scheduler_schedule" \
            --scheduler-state "$scheduler_state" \
            --scheduler-uri "$scheduler_uri" \
            --scheduler-last-attempt "$scheduler_last_attempt" \
            --scheduler-status-code "$scheduler_status_code"

      - name: Read production billing state
        id: billing-audit
        env:
          API_SECRET_BINDINGS: ${{ vars.API_SECRET_BINDINGS }}
          APP_MODE: production
          BILLING_ENABLED: 'false'
          BILLING_RECONCILIATION_MODE: ${{ vars.BILLING_RECONCILIATION_MODE }}
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID: ${{ vars.STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID }}
          STRIPE_SINGLE_SUBSCRIPTION_REDIRECT_VERIFIED_AT: ${{ vars.STRIPE_SINGLE_SUBSCRIPTION_REDIRECT_VERIFIED_AT }}
          SKIP_ENV_VALIDATION: '1'
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$RUNNER_TEMP/billing-production-audit"

          read_bound_secret() {
            local env_name="$1"
            local binding
            local secret_name
            local secret_version
            local value
            binding="$(printf '%s\n' "$API_SECRET_BINDINGS" | awk -F'[=:]' -v name="$env_name" '$1 == name { print $2 ":" $3; exit }')"
            if [ -z "$binding" ]; then
              echo "Missing production secret binding for $env_name." >&2
              return 1
            fi
            secret_name="${binding%:*}"
            secret_version="${binding##*:}"
            value="$(gcloud secrets versions access "$secret_version" \
              --secret="$secret_name" --project="$GCP_PROJECT_ID" --quiet)"
            echo "::add-mask::$value"
            declare -gx "$env_name=$value"
          }

          read_bound_secret DATABASE_URL
          read_bound_secret STRIPE_SECRET_KEY

          set +e
          pnpm exec tsx scripts/billing-launch-audit.ts \
            --out "$RUNNER_TEMP/billing-production-audit/billing-launch-audit.json" \
            2>"$RUNNER_TEMP/billing-production-audit/billing-launch-audit.log"
          audit_status=$?
          set -e

          if [ "$audit_status" -ne 0 ]; then
            probe_dir="$(mktemp -d)"
            trap 'rm -rf "$probe_dir"' EXIT

            probe_stripe_account() {
              local raw_file="$probe_dir/account-response.json"
              local sanitized_file="$probe_dir/account-sanitized.json"
              local http_status
              local curl_status
              local account_id=null
              local error_type=null
              local error_code=null

              set +e
              http_status="$(curl --silent --show-error \
                --output "$raw_file" \
                --write-out '%{http_code}' \
                --get 'https://api.stripe.com/v1/account' \
                --header "Authorization: Bearer $STRIPE_SECRET_KEY")"
              curl_status=$?
              set -e

              if [ -s "$raw_file" ] && jq -e . "$raw_file" >/dev/null 2>&1; then
                account_id="$(jq -r '.id // null' "$raw_file")"
                error_type="$(jq -r '.error.type // null' "$raw_file")"
                error_code="$(jq -r '.error.code // null' "$raw_file")"
              fi
              jq -n \
                --arg accountId "$account_id" \
                --arg expectedAccountId "$STRIPE_HYPERTEXT_STUDIO_ACCOUNT_ID" \
                --arg httpStatus "$http_status" \
                --arg errorType "$error_type" \
                --arg errorCode "$error_code" \
                --argjson curlExit "$curl_status" \
                '{
                  resource: "account",
                  curlExit: $curlExit,
                  httpStatus: (if $httpStatus == "000" or $httpStatus == "" then null else ($httpStatus | tonumber) end),
                  accountId: (if $accountId == "null" then null else $accountId end),
                  accountMatchesExpected: ($accountId == $expectedAccountId),
                  errorType: (if $errorType == "null" then null else $errorType end),
                  errorCode: (if $errorCode == "null" then null else $errorCode end)
                }' > "$sanitized_file"
            }

            probe_stripe_search() {
              local resource="$1"
              local raw_file="$probe_dir/$resource-response.json"
              local sanitized_file="$probe_dir/$resource-sanitized.json"
              local http_status
              local curl_status
              local error_type=null
              local error_code=null

              set +e
              http_status="$(curl --silent --show-error \
                --output "$raw_file" \
                --write-out '%{http_code}' \
                --get "https://api.stripe.com/v1/$resource/search" \
                --header "Authorization: Bearer $STRIPE_SECRET_KEY" \
                --data-urlencode "query=metadata['referenceId']:'__docket_launch_probe__'" \
                --data-urlencode 'limit=1')"
              curl_status=$?
              set -e

              if [ -s "$raw_file" ] && jq -e . "$raw_file" >/dev/null 2>&1; then
                error_type="$(jq -r '.error.type // null' "$raw_file")"
                error_code="$(jq -r '.error.code // null' "$raw_file")"
              fi
              jq -n \
                --arg resource "$resource" \
                --arg httpStatus "$http_status" \
                --arg errorType "$error_type" \
                --arg errorCode "$error_code" \
                --argjson curlExit "$curl_status" \
                '{
                  resource: $resource,
                  curlExit: $curlExit,
                  httpStatus: (if $httpStatus == "000" or $httpStatus == "" then null else ($httpStatus | tonumber) end),
                  errorType: (if $errorType == "null" then null else $errorType end),
                  errorCode: (if $errorCode == "null" then null else $errorCode end)
                }' > "$sanitized_file"
            }

            probe_stripe_account
            probe_stripe_search customers
            probe_stripe_search subscriptions
            jq -s '.' "$probe_dir"/*-sanitized.json \
              > "$RUNNER_TEMP/billing-production-audit/billing-provider-read-probe.json"
          else
            printf '%s\n' '[]' \
              > "$RUNNER_TEMP/billing-production-audit/billing-provider-read-probe.json"
          fi
          echo "status=$audit_status" >> "$GITHUB_OUTPUT"

      - name: Extract failed billing-action diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/billing-production-audit"
          report="$RUNNER_TEMP/billing-production-audit/billing-launch-audit.json"
          if [ -f "$report" ]; then
            jq '[
                .organizations[]
                | .organizationId as $organizationId
                | .problems[]
                | select(.code == "provider_sync_unresolved" or .code == "provider_query_failed")
                | { organizationId: $organizationId, code, message }
              ]' "$report" \
              > "$RUNNER_TEMP/billing-production-audit/billing-provider-errors.json"
          else
            printf '%s\n' '[]' \
              > "$RUNNER_TEMP/billing-production-audit/billing-provider-errors.json"
          fi

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: billing-production-audit
          path: ${{ runner.temp }}/billing-production-audit/
          retention-days: 7
          if-no-files-found: error

      - name: Enforce billing audit result
        if: always()
        env:
          AUDIT_STATUS: ${{ steps.billing-audit.outputs.status }}
        run: test "$AUDIT_STATUS" = 0
