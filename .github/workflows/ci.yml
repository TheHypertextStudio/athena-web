name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pull-request runs are worth cancelling; superseded pushes to `main` are not.
# `deploy-production` is the last job of this run, so cancelling a push to `main` throws away that
# commit's only deploy — and at this repo's merge rate, every run cancels the one before it and
# nothing ever ships. Pushes to `main` queue instead. The concurrency group still serializes them,
# so two deploys can never race; they take turns.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Turbo Remote Cache. A task computed on any run — or on a developer's linked machine — is
# replayed rather than recomputed here, so a pull request that touches one package no longer pays
# to rebuild and retest the other eighteen.
#
# These are configured, not aspirational: TURBO_TOKEN is a Vercel Access Token scoped to the team
# in TURBO_TEAM, and TURBO_REMOTE_CACHE_SIGNATURE_KEY is required by `remoteCache.signature` in
# turbo.json. They were unset for a long time, during which turbo silently fell back to the local
# cache and reported `Cached: 0 cached, 19 total` on every run — silently, because an unset token
# is not an error. If cache hits ever vanish, check that the token has not expired before
# suspecting the task graph. TURBO_API is only for a self-hosted cache; unset means Vercel's.
#
# There is deliberately no `actions/cache` step for `.turbo`. The remote cache supersedes it, and
# keeping both meant paying GitHub's cache I/O for a result the remote cache already had — the
# Build job spent 39s restoring and 24s saving to serve a task that took 2s.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # Lint and typecheck were one job on the theory that they share an install. They also shared a
  # runner, and `ubuntu-latest` has two cores — so turbo scheduled them in parallel and the CPU
  # serialized them anyway. Measured at concurrency 2: lint 83s, typecheck 48s, 166s together in
  # CI. Two jobs cost the slower one rather than the sum, and a second install off a warm pnpm
  # store is 15s.
  #
  # Lint is the expensive half and it is two packages: @docket/web at 53.7s and @docket/api at
  # 51.7s, out of 159s of total task time. Both are type-aware — tooling/eslint-config/index.js
  # turns on strictTypeChecked/stylisticTypeChecked with projectService — so ESLint builds the
  # same TypeScript program `tsc --noEmit` just built, then runs rules over it. That duplication
  # is the real defect here; splitting the jobs only stops us paying for it twice in series.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run lint --concurrency=1

  typecheck:
    name: Types
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Rides with typecheck rather than lint to balance the two runners: typecheck 48s plus
      # format 33s lands beside lint's 83s.
      - run: pnpm turbo run typecheck --concurrency=1

      - run: pnpm format:check

      # SCR-19/SCR-20 guard: fails when a job that runs tests or checks is added to this file
      # without being added to deploy-production.needs, or when a gating step is soft-failed
      # (continue-on-error, `|| true`, `if: always()`). See scripts/ci-gate-policy.ts.
      - run: pnpm ci:gate-policy

  # GEN-06 clause 1: no credential may reach the default branch. Fails the run — and therefore
  # the production deploy, via deploy-production.needs — on any finding.
  #
  # The gate is `scripts/secret-scan.ts`, the in-repo scanner, NOT gitleaks/gitleaks-action.
  # The action is free for personal accounts but requires a licence key for org-owned
  # repositories (this one is), so wiring it in as the gate would mean a job that fails on
  # every run until someone sets GITLEAKS_LICENSE — a security gate nobody can turn green gets
  # disabled, not fixed. The in-repo scanner reads the same `.gitleaks.toml` rules, downloads
  # nothing, and is itself proven to fire by packages/test-utils/tests/security/secret-scan.test.ts.
  # Scanning git *history* with the upstream binary remains a licensed follow-on; see
  # docs/engineering/ci-gating.md.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the licensed `gitleaks dir`/`gitleaks git` second opinion can be run
          # on this same checkout without re-cloning.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm secret-scan

  # SCR-15: the repo's gating test command. Every package's `test` script is a bare `vitest run`
  # that enforces no thresholds, on purpose, so the inner loop (`pnpm --filter <pkg> test`) stays
  # fast. The thresholds in tooling/vitest/preset.ts (90 default, 100 for the trust-spine
  # packages) only fire under `test:coverage`, so that is what runs here and what makes a coverage
  # regression fail the build. Do not soft-fail it.
  # Current per-package numbers: docs/engineering/coverage-ledger.md
  #
  # One job, not two. `turbo run test` and `turbo run test:coverage` run the same suites over the
  # same file set; `--coverage` is additive instrumentation and `all: true` makes it the slower of
  # the pair, so a separate uninstrumented run reports nothing this one does not.
  # Sharded across three runners, because the work does not fit one. Measured on run 31865988406,
  # this task ran 19 package suites on a single two-core runner in 16m47s — 87% of the whole
  # pipeline — while four other runners sat idle. The split is by PACKAGE, not by test file:
  # each package computes its own coverage, so the thresholds in tooling/vitest/preset.ts stay
  # intact with no report-merging machinery. Splitting by file would hand each shard a partial
  # coverage number and fail the 89% gate in apps/api/vite.config.ts.
  #
  # The groups partition the task set exactly — `turbo run test:coverage --dry` reports 19
  # packages, and api(1) + web(1) + rest(17) = 19. If a package is ever added that matches none
  # of these filters it would silently go untested, so the `rest` group is defined by EXCLUSION
  # rather than by an enumerated list: anything new lands there by default.
  #
  # The job id stays `test`, so `deploy-production.needs` and scripts/ci-gate-policy.ts (SCR-19)
  # keep working unchanged — a matrix multiplies the runs, not the id.
  test:
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      # One slow package's failure must not hide the other two shards' results.
      fail-fast: false
      matrix:
        include:
          # apps/api — 6m20s, the long pole. 345 suites, 241 of which bootstrap a database.
          - group: api
            filter: --filter=@docket/api
            tooling: false
          # apps/web — 4m35s.
          - group: web
            filter: --filter=@docket/web
            tooling: false
          # The other 17 packages, ~6m combined.
          - group: rest
            filter: --filter=!@docket/api --filter=!@docket/web
            tooling: true
    env:
      # Tests run in local/pglite mode — skip prod env validation.
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run test:coverage ${{ matrix.filter }} --concurrency=1

      # `turbo run test:coverage` only runs *package* suites. The repository-level suites under `tests/`
      # — the CI gate policy (tests/ci) and the launch-record reconciler (tests/launch) — belong
      # to no workspace package, so turbo never sees them. Without this step the guards that
      # protect this very file would not run in CI at all. They ride with `rest` so they run
      # exactly once rather than three times.
      - run: pnpm test:tooling
        if: matrix.tooling

      - id: coverage
        if: always()
        run: |
          if find . -path '*/coverage/*' \( -name 'coverage-final.json' -o -name 'lcov.info' -o -name '*.xml' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload only when a test task actually generated coverage files.
      - uses: codecov/codecov-action@v7
        if: always() && steps.coverage.outputs.found == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Production credentials are validated at deployment; CI verifies every build artifact
      # without exposing production secrets to pull-request runners.
      SKIP_ENV_VALIDATION: '1'
      API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.WEB_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --concurrency=1

  # Deliberately NO `needs`. The Docker builds take ~4 minutes and depend on nothing the check
  # jobs produce, so they run alongside them rather than after: by the time the gates are green
  # both images are already in Artifact Registry and `deploy-production` has only migrations and
  # the Cloud Run rollout left to do.
  #
  # This is not a hole in the gating. Building an image publishes nothing a user can reach —
  # `deploy-production` below still needs every check job, so a red run rolls out nothing. The
  # cost is one discarded image build on a failing run, which is the point of the trade.
  # `scripts/ci-gate-policy.ts` sees a job with no gating command and correctly does not classify
  # it as a check job, so SCR-19 is unaffected.
  build-images:
    name: Build deploy images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit

  # Browser e2e against the real dev stack (Portless routing + Next dev + Hono API + PGlite),
  # exactly the topology `pnpm dev` gives a developer — including the MCP OAuth flows
  # (register → consent → token → Bearer /mcp), which .env.local enables locally.
  # SCR-19: `needs` must name EVERY job above that runs tests or checks. Adding a check job
  # without adding it here would let a red check ship to production; `pnpm ci:gate-policy`
  # (run in the `quality` job, and by tests/ci/ci-gate-policy.test.ts) fails when that happens.
  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, secret-scan, test, build, build-images]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
