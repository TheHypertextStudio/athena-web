name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Turbo Remote Cache (optional): set these to share the cache across CI runs and machines so a
# task computed on one run is replayed on the next. All unset → turbo silently uses the local
# `.turbo` cache only (current behavior, no-op). When TURBO_TOKEN is set, the signature key is
# required by `remoteCache.signature` in turbo.json. For a self-hosted cache also set TURBO_API
# (repo variable); omit it to use the Vercel Remote Cache.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # Lint + typecheck run together — same install, no reason for separate runners.
  quality:
    name: Lint & Types
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      # Turbo task cache — on exact SHA hit turbo replays outputs without re-running.
      # restore-keys falls back to the nearest ancestor commit's cache so only
      # tasks whose inputs changed are re-executed.
      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-quality-${{ runner.os }}-

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm turbo run lint typecheck --cache-dir=.turbo

      - run: pnpm format:check

      # SCR-19/SCR-20 guard: fails when a job that runs tests or checks is added to this file
      # without being added to deploy-production.needs, or when a gating step is soft-failed
      # (continue-on-error, `|| true`, `if: always()`). See scripts/ci-gate-policy.ts.
      - run: pnpm ci:gate-policy

  # GEN-06 clause 1: no credential may reach the default branch. Fails the run — and therefore
  # the production deploy, via deploy-production.needs — on any finding.
  #
  # The gate is `scripts/secret-scan.ts`, the in-repo scanner, NOT gitleaks/gitleaks-action.
  # The action is free for personal accounts but requires a licence key for org-owned
  # repositories (this one is), so wiring it in as the gate would mean a job that fails on
  # every run until someone sets GITLEAKS_LICENSE — a security gate nobody can turn green gets
  # disabled, not fixed. The in-repo scanner reads the same `.gitleaks.toml` rules, downloads
  # nothing, and is itself proven to fire by packages/test-utils/tests/security/secret-scan.test.ts.
  # Scanning git *history* with the upstream binary remains a licensed follow-on; see
  # docs/engineering/ci-gating.md.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the licensed `gitleaks dir`/`gitleaks git` second opinion can be run
          # on this same checkout without re-cloning.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm secret-scan

  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      # Tests run in local/pglite mode — skip prod env validation.
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-test-${{ runner.os }}-

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm turbo run test --cache-dir=.turbo

      # `turbo run test` only runs *package* suites. The repository-level suites under `tests/`
      # — the CI gate policy (tests/ci) and the launch-record reconciler (tests/launch) — belong
      # to no workspace package, so turbo never sees them. Without this step the guards that
      # protect this very file would not run in CI at all.
      - run: pnpm test:tooling

      - id: coverage
        if: always()
        run: |
          if find . -path '*/coverage/*' \( -name 'coverage-final.json' -o -name 'lcov.info' -o -name '*.xml' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload only when a test task actually generated coverage files.
      - uses: codecov/codecov-action@v7
        if: always() && steps.coverage.outputs.found == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # SCR-15: the repo's *gating* test command. `turbo run test` (the `test` job above) runs the
  # suites but enforces no thresholds — every package's `test` script is a bare `vitest run`, on
  # purpose, so the inner loop (`pnpm --filter <pkg> test`) stays fast. The thresholds in
  # tooling/vitest/preset.ts (90 default, 100 for the trust-spine packages) only fire under each
  # package's `test:coverage` script, so THIS is the job that makes a coverage regression fail
  # the build. It is listed in deploy-production.needs; do not soft-fail it.
  # Current per-package numbers and the debt this gate exposes: docs/engineering/coverage-ledger.md
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-coverage-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-coverage-${{ runner.os }}-

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm turbo run test:coverage --cache-dir=.turbo

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Production credentials are validated at deployment; CI verifies every build artifact
      # without exposing production secrets to pull-request runners.
      SKIP_ENV_VALIDATION: '1'
      API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.WEB_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-build-${{ runner.os }}-

      - run: pnpm install --no-frozen-lockfile

      - run: pnpm turbo run build --cache-dir=.turbo

  # Browser e2e against the real dev stack (Portless routing + Next dev + Hono API + PGlite),
  # exactly the topology `pnpm dev` gives a developer — including the MCP OAuth flows
  # (register → consent → token → Bearer /mcp), which .env.local enables locally.
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # A couple of specs (pwa-offline-sync's reconnect-sync test, fluid-scheduling-gestures' people-
    # card comparison test) have each independently taken 3-9 minutes under CI load, on top of the
    # ~15 minutes the other ~50 specs take. 30 minutes was cutting the job off via GitHub's own job
    # timeout mid-run — the *test* retries were never actually exhausted, so the run reported as
    # cancelled without ever printing which of the later specs pass or fail. Raised to give the
    # suite room to actually finish and report real results instead of an artificial cutoff.
    timeout-minutes: 45
    env:
      PORTLESS_PORT: '1355'
      PORTLESS_HTTPS: '0'
      PORTLESS_SYNC_HOSTS: '0'
      APP_URL: http://docket.localhost:1355
      API_URL: http://api.docket.localhost:1355
      WEB_URL: http://docket.localhost:1355
      NEXT_PUBLIC_API_URL: http://api.docket.localhost:1355
      NEXT_PUBLIC_APP_URL: http://docket.localhost:1355
      BETTER_AUTH_URL: http://api.docket.localhost:1355
      BETTER_AUTH_PASSKEY_RP_ID: docket.localhost
      NEXT_PUBLIC_PASSKEY_RP_ID: docket.localhost
      BETTER_AUTH_TRUSTED_ORIGINS: http://docket.localhost:1355,http://admin.docket.localhost:1355
      MCP_ISSUER_URL: http://api.docket.localhost:1355
      MCP_RESOURCE_URL: http://api.docket.localhost:1355/mcp
      MCP_ALLOWED_ORIGINS: http://docket.localhost:1355
      OIDC_LOGIN_PAGE_URL: http://docket.localhost:1355/sign-in
      AGENT_MAX_TURNS: '24'
      GOOGLE_OAUTH_PUBLIC: 'false'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'

      - run: npm install -g corepack@0.35.0 && corepack enable

      - run: pnpm install --no-frozen-lockfile

      # Pin the routed hosts so name resolution is deterministic on every runner image.
      - name: Map dev hosts to loopback
        run: echo "127.0.0.1 docket.localhost api.docket.localhost admin.docket.localhost" | sudo tee -a /etc/hosts

      # Portless documents :1355 as its non-privileged mode. HTTP *.localhost remains a secure
      # browser context for WebAuthn, so CI needs neither sudo nor a generated certificate.
      - name: Start portless proxy
        run: pnpm exec portless proxy start --port 1355 --no-tls

      - name: Start dev stack
        run: pnpm dev > /tmp/dev.log 2>&1 &

      - run: pnpm --filter @docket/web exec playwright install --with-deps chromium

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 120); do
            web=$(curl -s -o /dev/null -w "%{http_code}" http://docket.localhost:1355 || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://api.docket.localhost:1355/v1/health || true)
            oidc=$(curl -s -o /dev/null -w "%{http_code}" http://api.docket.localhost:1355/api/auth/.well-known/oauth-authorization-server || true)
            echo "web=$web api=$api oidc=$oidc"
            if [ "$web" = "200" ] && [ "$api" = "200" ] && [ "$oidc" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "dev stack never became ready" >&2
          tail -100 /tmp/dev.log >&2
          exit 1

      - run: pnpm --filter @docket/web test:e2e

      - name: Dev stack log on failure
        if: failure()
        run: tail -200 /tmp/dev.log

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-artifacts
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  # SCR-19: `needs` must name EVERY job above that runs tests or checks. Adding a check job
  # without adding it here would let a red check ship to production; `pnpm ci:gate-policy`
  # (run in the `quality` job, and by tests/ci/ci-gate-policy.test.ts) fails when that happens.
  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, secret-scan, test, coverage, build, e2e]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
