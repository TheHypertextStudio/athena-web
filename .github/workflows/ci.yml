name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Superseded pull-request runs are worth cancelling; superseded pushes to `main` are not.
# `deploy-production` is the last job of this run, so cancelling a push to `main` throws away that
# commit's only deploy — and at this repo's merge rate, every run cancels the one before it and
# nothing ever ships. Pushes to `main` queue instead. The concurrency group still serializes them,
# so two deploys can never race; they take turns.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Turbo Remote Cache. A task computed on any run — or on a developer's linked machine — is
# replayed rather than recomputed here, so a pull request that touches one package no longer pays
# to rebuild and retest the other eighteen.
#
# These are configured, not aspirational: TURBO_TOKEN is a Vercel Access Token scoped to the team
# in TURBO_TEAM, and TURBO_REMOTE_CACHE_SIGNATURE_KEY is required by `remoteCache.signature` in
# turbo.json. They were unset for a long time, during which turbo silently fell back to the local
# cache and reported `Cached: 0 cached, 19 total` on every run — silently, because an unset token
# is not an error. If cache hits ever vanish, check that the token has not expired before
# suspecting the task graph. TURBO_API is only for a self-hosted cache; unset means Vercel's.
#
# There is deliberately no `actions/cache` step for `.turbo`. The remote cache supersedes it, and
# keeping both meant paying GitHub's cache I/O for a result the remote cache already had — the
# Build job spent 39s restoring and 24s saving to serve a task that took 2s.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # Lint and typecheck were one job on the theory that they share an install. They also shared a
  # runner, and `ubuntu-latest` has two cores — so turbo scheduled them in parallel and the CPU
  # serialized them anyway. Measured at concurrency 2: lint 83s, typecheck 48s, 166s together in
  # CI. Two jobs cost the slower one rather than the sum, and a second install off a warm pnpm
  # store is 15s.
  #
  # Lint is the expensive half and it is two packages: @docket/web at 53.7s and @docket/api at
  # 51.7s, out of 159s of total task time. Both are type-aware — tooling/eslint-config/index.js
  # turns on strictTypeChecked/stylisticTypeChecked with projectService — so ESLint builds the
  # same TypeScript program `tsc --noEmit` just built, then runs rules over it. That duplication
  # is the real defect here; splitting the jobs only stops us paying for it twice in series.
  # `--concurrency=1` is load-bearing and stays: type-aware ESLint builds a full TypeScript program
  # per package, and @docket/api's alone spikes to ~2.5GB, so running packages concurrently on one
  # runner exhausts it. What that flag cost was wall-clock — 25 packages one after another took
  # 430s, making this the slowest job in the pipeline.
  #
  # Sharding restores the parallelism without touching the memory ceiling: each runner still lints
  # exactly one package at a time, there are simply three runners. api is alone because it is the
  # 2.5GB one; web and admin ride together because both first build @docket/api (their lint script
  # does) and would otherwise duplicate that build across two runners.
  lint:
    name: Lint (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            filter: --filter=@docket/api
          - group: apps
            filter: --filter=@docket/web --filter=@docket/admin
          - group: rest
            filter: --filter=!@docket/api --filter=!@docket/web --filter=!@docket/admin
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: timeout --signal=TERM --kill-after=10s 180s pnpm turbo run lint ${{ matrix.filter }} --concurrency=1

  # Sharded for the same reason as lint, and with the same memory ceiling intact: `tsc` holds a
  # whole program in memory per package, so each runner still typechecks one at a time. 26 packages
  # in series took 319s.
  typecheck:
    name: Types (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            filter: --filter=@docket/api
            gates: false
          - group: apps
            filter: --filter=@docket/web --filter=@docket/admin
            gates: false
          # The repo-wide gates ride here rather than on `api`, which is the long pole.
          - group: rest
            filter: --filter=!@docket/api --filter=!@docket/web --filter=!@docket/admin
            gates: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm turbo run typecheck ${{ matrix.filter }} --concurrency=1

      # Prettier reads the whole repo in one pass, so it belongs to no shard in particular and
      # runs exactly once.
      - run: pnpm format:check
        if: matrix.gates

      # Fails when a job that runs tests or checks is added to this file without being added to
      # deploy-production.needs, or when a gating step is soft-failed (continue-on-error,
      # `|| true`, `if: always()`). See scripts/ci-gate-policy.ts.
      - run: pnpm ci:gate-policy
        if: matrix.gates

  # No credential may reach the default branch. Fails the run — and therefore
  # the production deploy, via deploy-production.needs — on any finding.
  #
  # The gate is `scripts/secret-scan.ts`, the in-repo scanner, NOT gitleaks/gitleaks-action.
  # The action is free for personal accounts but requires a licence key for org-owned
  # repositories (this one is), so wiring it in as the gate would mean a job that fails on
  # every run until someone sets GITLEAKS_LICENSE — a security gate nobody can turn green gets
  # disabled, not fixed. The in-repo scanner reads the same `.gitleaks.toml` rules, downloads
  # nothing, and is itself proven to fire by packages/test-utils/tests/security/secret-scan.test.ts.
  # Scanning git *history* with the upstream binary remains a licensed follow-on; see
  # docs/engineering/ci-gating.md.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the licensed `gitleaks dir`/`gitleaks git` second opinion can be run
          # on this same checkout without re-cloning.
          fetch-depth: 0

      - uses: ./.github/actions/setup

      - run: pnpm secret-scan

  # The repo's gating test command. Every package's `test` script is a bare `vitest run`
  # that enforces no thresholds, on purpose, so the inner loop (`pnpm --filter <pkg> test`) stays
  # fast. The thresholds in tooling/vitest/preset.ts (90 default, 100 for the trust-spine
  # packages) only fire under `test:coverage`, so that is what runs here and what makes a coverage
  # regression fail the build. Do not soft-fail it.
  # Current per-package numbers: docs/engineering/coverage-ledger.md
  #
  # One job, not two. `turbo run test` and `turbo run test:coverage` run the same suites over the
  # same file set; `--coverage` is additive instrumentation and `all: true` makes it the slower of
  # the pair, so a separate uninstrumented run reports nothing this one does not.
  # Sharded across three runners, because the work does not fit one. Measured on run 31865988406,
  # this task ran 19 package suites on a single two-core runner in 16m47s — 87% of the whole
  # pipeline — while four other runners sat idle. The split is by PACKAGE, not by test file:
  # each package computes its own coverage, so the thresholds in tooling/vitest/preset.ts stay
  # intact with no report-merging machinery. Splitting by file would hand each shard a partial
  # coverage number and fail the 89% gate in apps/api/vite.config.ts.
  #
  # The groups partition the task set exactly — `turbo run test:coverage --dry` reports 25
  # packages, and api(1) + web(1) + rest(23) = 25. If a package is ever added that matches none
  # of these filters it would silently go untested, so the `rest` group is defined by EXCLUSION
  # rather than by an enumerated list: anything new lands there by default.
  #
  # Exclusion protects against a missing FILTER, not against a missing SCRIPT: a package that
  # declares no `test:coverage` is reported by turbo as `<NONEXISTENT>` and skipped in silence,
  # which is how @docket/admin and @docket/runner went untested here for as long as they existed.
  # repo-tests/tooling/package-script-integrity.test.ts is what closes that second hole.
  #
  # The job id stays `test`, so `deploy-production.needs` and scripts/ci-gate-policy.ts's
  # ungated-check-job check keep working unchanged — a matrix multiplies the runs, not the id.
  test:
    name: Test (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      # One slow package's failure must not hide the other two shards' results.
      fail-fast: false
      matrix:
        include:
          # apps/api — 6m20s, the long pole. 345 suites, 241 of which bootstrap a database.
          - group: api
            filter: --filter=@docket/api
            tooling: false
          # apps/web — 4m35s.
          - group: web
            filter: --filter=@docket/web
            tooling: false
          # The other 23 packages, ~6m combined.
          - group: rest
            filter: --filter=!@docket/api --filter=!@docket/web
            tooling: true
    env:
      # Tests run in local/pglite mode — skip prod env validation.
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm turbo run test:coverage ${{ matrix.filter }} --concurrency=1

      # A latency assertion cannot distinguish a query regression from coverage contention while
      # hundreds of instrumented API suites occupy sibling workers. The API coverage command omits
      # this one benchmark, then the API shard runs it alone with the same 300ms release limit.
      - run: pnpm --filter @docket/api test:performance
        if: matrix.group == 'api'

      # Coverage instrumentation and the other 416 Web files distort wall-clock layout timings.
      # The functional layout assertions stay in coverage, and this runs the two 100ms budgets
      # alone against the same production layout code.
      - run: pnpm --filter @docket/web test:performance
        if: matrix.group == 'web'

      # `turbo run test:coverage` only runs *package* suites. The repository-level suites under
      # `repo-tests/` — the CI gate policy (repo-tests/ci) and the launch-record reconciler
      # (repo-tests/launch) — belong to no workspace package, so turbo never sees them. Without
      # this step the guards that protect this very file would not run in CI at all. They ride
      # with `rest` so they run exactly once rather than three times.
      - run: pnpm test:tooling
        if: matrix.tooling

      - id: coverage
        if: always()
        run: |
          if find . -path '*/coverage/*' \( -name 'coverage-final.json' -o -name 'lcov.info' -o -name '*.xml' \) -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Upload only when a test task actually generated coverage files.
      - uses: codecov/codecov-action@v7
        if: always() && steps.coverage.outputs.found == 'true'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Production credentials are validated at deployment; CI verifies every build artifact
      # without exposing production secrets to pull-request runners.
      SKIP_ENV_VALIDATION: '1'
      API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_API_URL: ${{ vars.API_URL }}
      NEXT_PUBLIC_APP_URL: ${{ vars.WEB_URL }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - run: pnpm turbo run build --concurrency=1

  # This is the browser contract production depends on. The full E2E workflow remains advisory
  # while it contains unrelated flaky and evidence-oriented journeys, but a release may not skip
  # the basic proof that every primary authenticated screen and local-first detail can settle.
  # PostgreSQL is required here. PGlite normalizes aggregate numerics to JavaScript numbers and
  # therefore cannot expose the production postgres-js text-decoding failure that blanked Project
  # details on 2026-08-24.
  core-screen-smoke:
    name: Core screen acceptance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      # Test mode keeps the non-production sign-up code echo and mock providers without starting
      # the local three-second background scheduler inside this bounded release check.
      APP_MODE: test
      APP_URL: http://docket.localhost:3000
      WEB_URL: http://docket.localhost:3000
      API_URL: http://api.docket.localhost:4000
      NEXT_PUBLIC_APP_URL: http://docket.localhost:3000
      NEXT_PUBLIC_API_URL: http://api.docket.localhost:4000
      BETTER_AUTH_URL: http://api.docket.localhost:4000
      BETTER_AUTH_PASSKEY_RP_ID: docket.localhost
      NEXT_PUBLIC_PASSKEY_RP_ID: docket.localhost
      BETTER_AUTH_TRUSTED_ORIGINS: http://docket.localhost:3000
      DATABASE_URL: postgres://docket:docket@127.0.0.1:5432/docket
      DATABASE_URL_UNPOOLED: postgres://docket:docket@127.0.0.1:5432/docket
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: docket
          POSTGRES_PASSWORD: docket
          POSTGRES_USER: docket
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docket -d docket"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup

      - name: Apply PostgreSQL migrations
        # The job already owns a healthy PostgreSQL service. Running the root Turbo task would
        # invoke db:up and try to start a second Docker Compose database inside the runner.
        run: pnpm exec dotenv -e .env.local -- pnpm --filter @docket/db db:migrate

      - name: Build the production Web app
        env:
          SKIP_ENV_VALIDATION: '1'
        run: pnpm turbo run build --filter=@docket/web --concurrency=1

      - name: Assemble the standalone Web server
        run: |
          set -euo pipefail
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public

      - name: Start the API and Web app
        run: |
          PORT=4000 pnpm exec dotenv -e .env.local -- \
            pnpm --filter @docket/api exec tsx src/server.ts > /tmp/api.log 2>&1 &
          cd apps/web/.next/standalone/apps/web
          PORT=3000 HOSTNAME=127.0.0.1 node server.js > /tmp/web.log 2>&1 &

      - name: Map test hosts to loopback
        run: echo "127.0.0.1 docket.localhost api.docket.localhost" | sudo tee -a /etc/hosts

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @docket/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies
        run: pnpm --filter @docket/web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Wait for the release stack
        run: |
          for _ in $(seq 1 60); do
            web=$(curl -s -o /dev/null -w "%{http_code}" http://docket.localhost:3000/sign-in || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://api.docket.localhost:4000/v1/health || true)
            echo "web=$web api=$api"
            if [ "$web" = "200" ] && [ "$api" = "200" ]; then exit 0; fi
            sleep 5
          done
          tail -100 /tmp/web.log /tmp/api.log >&2
          exit 1

      - name: Verify release-critical user journeys
        run: >-
          pnpm --filter @docket/web exec playwright test
          e2e/release/core-screen-acceptance.spec.ts
          e2e/platform/pwa-offline-sync.spec.ts
          e2e/work/work-views.spec.ts
          --workers=1

      - name: Server logs
        if: always()
        run: tail -n 100 -- /tmp/web.log /tmp/api.log || true

      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: core-screen-acceptance
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Deliberately NO `needs`. The Docker builds take ~4 minutes and depend on nothing the check
  # jobs produce, so they run alongside them rather than after: by the time the gates are green
  # both images are already in Artifact Registry and `deploy-production` has only migrations and
  # the Cloud Run rollout left to do.
  #
  # This is not a hole in the gating. Building an image publishes nothing a user can reach —
  # `deploy-production` below still needs every check job, so a red run rolls out nothing. The
  # cost is one discarded image build on a failing run, which is the point of the trade.
  # `scripts/ci-gate-policy.ts` sees a job with no gating command and correctly does not classify
  # it as a check job, so it isn't required to appear in deploy-production.needs on that basis —
  # it's listed there anyway, for the image-consumption ordering, not to satisfy that rule.
  build-images:
    name: Build deploy images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit

  # `cancel-in-progress: false` above protects an ACTIVE deploy from being killed mid-migration —
  # that is the fix for the 2026-08-05 outage, and it stays. But it means a run that started from
  # an older push keeps paying for its gates even after newer commits have landed on `main`: under
  # a burst of rapid pushes (several agents committing directly to main within the same
  # ~15-20 minute gate window), a run can reach `deploy-production` for a commit `main` has already
  # moved past. Deploying it anyway just means a second, immediate rollout when the next run's
  # deploy lands on top of it. This job `needs` the same gates `deploy-production` does, so it
  # checks freshness right before `deploy-production` would start rather than at T+0 when the run
  # began — a check made 15-20 minutes early would already be stale by the time it's used. If
  # `main` has moved on, `deploy-production` stands down — nothing has been touched yet, so this
  # is a plain skip, not a cancellation of anything in flight.
  still-latest:
    name: Still latest on main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, typecheck, secret-scan, test, build, core-screen-smoke, build-images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in 1 2 3; do
            latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha') && break
            sleep 5
          done
          if [ -z "$latest" ]; then
            echo "::error::Could not read main's current tip after 3 attempts; failing closed."
            exit 1
          fi
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main has moved to $latest since this run started at $GITHUB_SHA — skipping deploy for a stale commit."
          fi

  # Browser e2e against the real dev stack (Portless routing + Next dev + Hono API + PGlite),
  # exactly the topology `pnpm dev` gives a developer — including the MCP OAuth flows
  # (register → consent → token → Bearer /mcp), which .env.local enables locally.
  # `needs` must name EVERY job above that runs tests or checks. Adding a check job without
  # adding it here would let a red check ship to production; `pnpm ci:gate-policy`
  # (run in the `quality` job, and by repo-tests/ci/ci-gate-policy.test.ts) fails when that happens.
  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.still-latest.outputs.proceed == 'true'
    needs:
      [lint, typecheck, secret-scan, test, build, core-screen-smoke, build-images, still-latest]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
