name: Debug Cloud Run logs

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Cloud Run revision name to read logs for
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  fetch-logs:
    name: Fetch logs for a revision
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Read revision logs
        run: |
          gcloud logging read \
            'resource.type="cloud_run_revision" AND resource.labels.revision_name="${{ github.event.inputs.revision }}"' \
            --project="${{ vars.GCP_PROJECT_ID }}" \
            --limit=500 \
            --order=asc \
            --format="table(timestamp,severity,textPayload,jsonPayload.message)"
