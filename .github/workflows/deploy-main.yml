name: Deploy main

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact main commit with successful CI and a staging deployment.
        required: true
        type: string
      staging_acceptance:
        description: Confirm the affected daily-planning flow passed on the staging deployment.
        required: true
        type: choice
        options: [no, yes]
        default: no
      staging_evidence:
        description: Brief evidence reference and the staging journey observed for this commit.
        required: true
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  still-latest:
    name: Confirm validated commit is still main
    if: ${{ github.repository == 'TheHypertextStudio/athena-web' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.workflow_ref == 'TheHypertextStudio/athena-web/.github/workflows/deploy-main.yml@refs/heads/main' }}
    runs-on:
      group: studio-linux
      labels: [self-hosted, Linux, ARM64, studio-linux]
    permissions:
      contents: read
      actions: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_ACCEPTANCE: ${{ inputs.staging_acceptance }}
          STAGING_EVIDENCE: ${{ inputs.staging_evidence }}
        run: |
          set -euo pipefail
          if [[ "$STAGING_ACCEPTANCE" != 'yes' || -z "${STAGING_EVIDENCE//[[:space:]]/}" ]]; then
            echo '::error::Staging acceptance and its evidence reference are required.'
            exit 1
          fi
          latest="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [[ "$latest" != "$RELEASE_SHA" || "$GITHUB_SHA" != "$RELEASE_SHA" ]]; then
            echo '::error::Release SHA must be the current main commit.'
            exit 1
          fi
          ci_sha="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --branch main --commit "$RELEASE_SHA" --event push --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .headSha')"
          if [[ "$ci_sha" != "$RELEASE_SHA" ]]; then
            echo '::error::Ordinary CI has not succeeded for this exact main commit.'
            exit 1
          fi
          staging_sha="$(gh run list --repo "$GITHUB_REPOSITORY" \
            --workflow deploy-workers-staging.yml --branch main \
            --commit "$RELEASE_SHA" --event workflow_dispatch --limit 1 \
            --json status,conclusion,headSha \
            --jq '.[0] | select(.status == "completed" and .conclusion == "success") | .headSha')"
          if [[ "$staging_sha" != "$RELEASE_SHA" ]]; then
            echo '::error::The exact release commit has not been deployed successfully to staging.'
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"
          printf '## Staging acceptance\n\nCommit: %s\n\nEvidence: %s\n' \
            "$RELEASE_SHA" "$STAGING_EVIDENCE" >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy production
    needs: still-latest
    if: needs.still-latest.outputs.proceed == 'true'
    permissions:
      contents: read
      packages: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      release_sha: ${{ inputs.release_sha }}
    secrets: inherit

  # Observe the current public documentation after the backend release. Frontend publication
  # is independent: this workflow does not deploy it or require a new frontend version for
  # every backend change. The bounded verifier reports live delivery without replacing gates.
  verify-docs:
    name: Verify docs
    needs: deploy-production
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/verify-docs.yml
