name: Deploy production

on:
  workflow_call:

env:
  REGION: ${{ vars.GCP_REGION }}
  REGISTRY: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/docket
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-api:
    name: Migrate database and deploy API
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Validate production Secret Manager bindings
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          API_SECRET_BINDINGS: ${{ vars.API_SECRET_BINDINGS }}
          BILLING_ENABLED: ${{ vars.BILLING_ENABLED || 'false' }}
        run: npx -y tsx scripts/production-secrets.ts

      - uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - id: node-ver
        run: echo "value=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          # The migration step below runs this exact image. Exporting it to the runner's daemon
          # here costs a local image load; re-fetching it from Artifact Registry cost a full pull
          # of an image this runner builds moments earlier.
          load: true
          tags: ${{ env.REGISTRY }}/api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          build-args: NODE_VERSION=${{ steps.node-ver.outputs.value }}

      - name: Apply production database migrations
        env:
          API_IMAGE: ${{ env.REGISTRY }}/api:${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          DATABASE_URL_UNPOOLED="$(gcloud secrets versions access latest \
            --secret=docket-database-url-unpooled \
            --project='${{ vars.GCP_PROJECT_ID }}')"
          export DATABASE_URL_UNPOOLED
          docker run --rm \
            --env DATABASE_URL_UNPOOLED \
            "$API_IMAGE" \
            node --import=tsx/esm /app/packages/db/src/migrate.ts

      - name: Write Cloud Run environment configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/docket-api-env.yaml" <<'EOF'
          NODE_ENV: production
          APP_MODE: production
          API_URL: "${{ vars.API_URL }}"
          WEB_URL: "${{ vars.WEB_URL }}"
          PUBLIC_BRIEF_HOST: "${{ vars.PUBLIC_BRIEF_HOST }}"
          BETTER_AUTH_URL: "${{ vars.API_URL }}"
          BETTER_AUTH_TRUSTED_ORIGINS: "${{ vars.WEB_URL }},${{ vars.ADMIN_URL }}"
          BETTER_AUTH_ALLOWED_HOSTS: "${{ vars.BETTER_AUTH_ALLOWED_HOSTS }}"
          BETTER_AUTH_PASSKEY_RP_ID: "${{ vars.PASSKEY_RP_ID }}"
          BETTER_AUTH_PASSKEY_RP_NAME: Docket
          GOOGLE_CALENDAR_WEBHOOK_URL: "${{ vars.API_URL }}/webhooks/calendar/google"
          GOOGLE_OAUTH_PUBLIC: "${{ vars.GOOGLE_OAUTH_PUBLIC }}"
          GOOGLE_OAUTH_TEST_EMAILS: "${{ vars.GOOGLE_OAUTH_TEST_EMAILS }}"
          AGENT_MAX_TURNS: "${{ vars.AGENT_MAX_TURNS }}"
          ATHENA_ASYNC_RUNNER_ENABLED: "false"
          BILLING_ENABLED: "${{ vars.BILLING_ENABLED || 'false' }}"
          MCP_TASKS_ENABLED: "false"
          EOF

      - id: deploy-api
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: docket-api
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/api:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --ingress=all
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
            --env-vars-file=${{ runner.temp }}/docket-api-env.yaml
          # Bootstrap owns this non-secret env→Secret Manager mapping. Optional providers are
          # mounted only after their secrets exist. Overwrite keeps retired mounts from surviving.
          secrets: ${{ vars.API_SECRET_BINDINGS }}
          secrets_update_strategy: overwrite

      - name: Show Cloud Run URL
        run: echo "docket-api=${{ steps.deploy-api.outputs.url }}"

      - name: Verify production health and auth routes
        env:
          API_URL: ${{ vars.API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-all-errors \
            --retry-delay 3 "$API_URL/v1/health" >/dev/null
          session_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            "$API_URL/api/auth/get-session")"
          test "$session_status" = 200
          signup_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST "$API_URL/api/auth/sign-up/request-code" \
            --header 'Content-Type: application/json' \
            --data '{}')"
          case "$signup_status" in
            400|422) ;;
            *) echo "signup challenge probe returned HTTP $signup_status" >&2; exit 1 ;;
          esac

  # Split out of deploy-api deliberately. Vercel gates production promotion on the check named
  # "Deploy production / Migrate database and deploy API" (docs/engineering/deployment.md), so
  # every second spent in that job delays the web release. Provisioning schedulers gates nothing
  # and runs ~10 describe+update pairs against gcloud, so it waits behind the API instead.
  ensure-scheduler:
    name: Ensure Cloud Scheduler jobs
    needs: deploy-api
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Ensure Cloud Scheduler jobs
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          API_URL: ${{ vars.API_URL }}
        run: npx -y tsx scripts/scheduler-setup.ts

  # No `needs: deploy-api`. The admin image consumes nothing the API job produces — every build
  # arg comes from repo vars — so the two Docker builds ran back to back for no reason. Admin is
  # the internal console and reaches the database only through the API, so the few seconds where
  # a new admin revision may precede the new API revision costs nothing a user can see.
  deploy-admin:
    name: Deploy admin
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: docker/setup-buildx-action@v4

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - id: node-ver
        run: echo "value=$(cat .node-version)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/admin/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/admin:${{ github.sha }}
          cache-from: type=gha,scope=admin
          cache-to: type=gha,scope=admin,mode=max
          build-args: |
            NODE_VERSION=${{ steps.node-ver.outputs.value }}
            API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.API_URL }}
            NEXT_PUBLIC_APP_URL=${{ vars.WEB_URL }}
            NEXT_PUBLIC_PASSKEY_RP_ID=${{ vars.PASSKEY_RP_ID }}

      - id: deploy-admin
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: docket-admin
          region: ${{ env.REGION }}
          image: ${{ env.REGISTRY }}/admin:${{ github.sha }}
          flags: >-
            --allow-unauthenticated
            --ingress=all
            --min-instances=0
            --max-instances=10
            --memory=512Mi
            --cpu=1
          env_vars: |
            NODE_ENV=production
            APP_MODE=production
          env_vars_update_strategy: overwrite

      - name: Show Cloud Run URL
        run: echo "docket-admin=${{ steps.deploy-admin.outputs.url }}"

  # The Cloudflare runner is additive today: the API env file above pins
  # ATHENA_ASYNC_RUNNER_ENABLED to "false", so no production traffic reaches this Worker until a
  # deliberate flip PR changes that line (docs/engineering/cloudflare-athena-execution.md,
  # "Production rollout and flag flip"). It still runs after deploy-api so a runner revision can
  # never precede the API revision that understands its callbacks.
  #
  # An operator provides this configuration once, before the first run:
  # - Repository variable CLOUDFLARE_ACCOUNT_ID — the Cloudflare account that owns
  #   docket-athena-runner. It doubles as this job's switch: environment-scoped variables are not
  #   visible in a job-level `if`, so it must live at repository level. While it is unset the job
  #   skips and the pipeline stays green.
  # - Repository secret CLOUDFLARE_API_TOKEN — an API token for that account, limited to
  #   Workers Scripts:Edit, Queues:Edit, and Workflows:Edit.
  # - The docket-athena-runs and docket-athena-runs-dlq queues plus the three Worker secrets
  #   (DOCKET_TO_CLOUDFLARE_HMAC_SECRET, CLOUDFLARE_TO_DOCKET_HMAC_SECRET, DOCKET_API_URL),
  #   created with `wrangler queues create` / `wrangler secret put` per the doc above. This job
  #   only deploys; it creates no queues and writes no secrets.
  # The explicit needs.deploy-api.result guard keeps the ordering invariant written into the
  # condition itself. Today it is redundant — an `if` with no status-check function is evaluated
  # with an implicit success() gate — but it stays correct even if someone later adds a status
  # function such as always(), which is the one edit that would silently drop the implicit gate.
  deploy-runner:
    name: Deploy Athena runner
    needs: deploy-api
    if: needs.deploy-api.result == 'success' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      # A filtered install so this job costs one workspace, not the monorepo. The deploy runs
      # the runner's own wrangler pin (apps/runner/package.json), so CI and an operator's local
      # deploy always use the same wrangler.
      - run: pnpm install --frozen-lockfile --filter @docket/runner...

      - name: Deploy docket-athena-runner
        working-directory: apps/runner
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
