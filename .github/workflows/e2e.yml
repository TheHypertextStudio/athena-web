# ci-gate-policy: advisory
name: E2E

# An advisory browser signal, not a production deploy gate. The browser suite is a slower, more
# fragile signal than the rest of CI, and a deploy held behind it stops shipping the moment it goes
# red. The header directive is checked by `ci:gate-policy`, so this exception is visible in its
# report and cannot be mistaken for a deploy gate without changing GitHub's existing check context.
# It reports here on every push and PR instead.
#
# Move it back into ci.yml's `deploy-production.needs` once it has been green for long enough to
# trust as a release gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The same Turbo Remote Cache ci.yml uses. Without these the build job below is the one place in
# the pipeline still recomputing a Next build that ci.yml's `build` job has usually already done
# and uploaded — same task, same hash, so it replays instead of rebuilding.
env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_API: ${{ vars.TURBO_API }}
  TURBO_REMOTE_CACHE_SIGNATURE_KEY: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

jobs:
  # The production build runs once here rather than once per shard. Each of the four shards used
  # to run `turbo run build --filter=@docket/web` itself, so the same Next build was paid for four
  # times over — and all four raced to write the same `turbo-e2e-<os>-<sha>` cache entry, so three
  # of the four uploads were discarded. Building once and shipping the output as an artifact makes
  # the cost independent of the shard count.
  build:
    name: Build the app
    runs-on: ubuntu-latest
    env:
      # `NEXT_PUBLIC_*` are inlined into the client bundle at build time, so the build must see
      # the same values the shards will serve under. Kept byte-identical to the `env:` block on
      # the e2e job below — if these drift, the bundle points at hosts the suite never starts.
      APP_URL: http://docket.localhost:3000
      WEB_URL: http://docket.localhost:3000
      API_URL: http://api.docket.localhost:4000
      NEXT_PUBLIC_APP_URL: http://docket.localhost:3000
      NEXT_PUBLIC_API_URL: http://api.docket.localhost:4000
      NEXT_PUBLIC_PASSKEY_RP_ID: docket.localhost
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A production build, not `next dev`. Under the dev server Turbopack compiles each route on
      # first request — inside whichever test asked for it — which on a two-core runner outlasts
      # any per-test budget worth setting and makes the suite's result a function of which spec
      # drew the cold route.
      - name: Build the app
        run: pnpm turbo run build --filter=@docket/web

      # `output: standalone` emits a server plus a traced module graph, but neither the static
      # assets nor `public/` — Next expects the deployment to place those, exactly as the
      # Dockerfiles do.
      - name: Assemble the standalone server
        run: |
          set -euo pipefail
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          tar -C apps/web/.next/standalone -czf web-standalone.tar.gz .

      # Next's traced pnpm tree contains symlinks. Uploading the directory directly replaces those
      # links with inert files, so the shards receive one tar archive that preserves them.
      # `retention-days: 1` because this artifact is an intra-run handoff, not a record.
      - uses: actions/upload-artifact@v6
        with:
          name: web-standalone
          path: web-standalone.tar.gz
          retention-days: 1

  e2e:
    name: E2E (${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-latest
    # Each shard is a separate runner with its own stack and its own embedded database, which is
    # what lets `workers: 1` (playwright.config.ts — the specs share one mutable database) coexist
    # with real parallelism. `fail-fast: false` so one shard's failure keeps the others' results.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # Catches a wedged runner, nothing finer. playwright.config.ts bounds individual tests, and a
    # cap tight enough to cut a failing shard short destroys the report that explains it: a
    # timed-out job is cancelled, so the reporter never prints and the upload below never fires.
    timeout-minutes: 15
    env:
      # The suite drives a production build served directly, so there is no dev proxy and no
      # port assignment to discover — the two servers own these ports. `*.localhost` resolves to
      # loopback, and stays a secure context, which WebAuthn needs for the passkey ceremonies.
      APP_URL: http://docket.localhost:3000
      WEB_URL: http://docket.localhost:3000
      API_URL: http://api.docket.localhost:4000
      NEXT_PUBLIC_APP_URL: http://docket.localhost:3000
      NEXT_PUBLIC_API_URL: http://api.docket.localhost:4000
      BETTER_AUTH_URL: http://api.docket.localhost:4000
      BETTER_AUTH_PASSKEY_RP_ID: docket.localhost
      NEXT_PUBLIC_PASSKEY_RP_ID: docket.localhost
      BETTER_AUTH_TRUSTED_ORIGINS: http://docket.localhost:3000
      MCP_ISSUER_URL: http://api.docket.localhost:4000
      MCP_RESOURCE_URL: http://api.docket.localhost:4000/mcp
      MCP_ALLOWED_ORIGINS: http://docket.localhost:3000
      OIDC_LOGIN_PAGE_URL: http://docket.localhost:3000/sign-in
      AGENT_MAX_TURNS: '24'
      GOOGLE_OAUTH_PUBLIC: 'false'
      SKIP_ENV_VALIDATION: '1'
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Map dev hosts to loopback
        run: echo "127.0.0.1 docket.localhost api.docket.localhost" | sudo tee -a /etc/hosts

      # Built once by the `build` job above. The tar archive preserves the pnpm links in the traced
      # module graph. Without them Next cannot resolve @swc/helpers and the server never starts.
      - uses: actions/download-artifact@v8
        with:
          name: web-standalone
          path: .

      - name: Extract the standalone server
        run: |
          mkdir -p apps/web/.next/standalone
          tar -xzf web-standalone.tar.gz -C apps/web/.next/standalone

      # Through `dotenv -e .env.local`, exactly as the root `dev` script does. That file is
      # committed and carries the local-mode settings the suite depends on — `DATABASE_URL` for the
      # embedded PGlite, and `APP_MODE=local`, which is what makes the sign-up endpoint echo its
      # one-time code back so the passkey ceremonies can complete without a mailbox. The job-level
      # `env` above still wins, since dotenv does not overwrite what is already set.
      - name: Apply migrations
        run: pnpm exec dotenv -e .env.local -- pnpm turbo run db:migrate --filter=@docket/db

      - name: Start the API
        run: |
          PORT=4000 pnpm exec dotenv -e .env.local -- \
            pnpm --filter @docket/api exec tsx src/server.ts > /tmp/api.log 2>&1 &

      # Served straight from the standalone output. `next start` does not honour the config's
      # `/v1` and `/api/auth` rewrites under `output: standalone` — it warns and tells you to run
      # this instead — and without those rewrites every auth request 404s and the suite stalls on
      # sign-up.
      - name: Start the web server
        run: |
          cd apps/web/.next/standalone/apps/web
          PORT=3000 HOSTNAME=127.0.0.1 node server.js > /tmp/web.log 2>&1 &

      - uses: actions/cache@v5
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @docket/web exec playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      # `--with-deps` above is what apt-installs Chromium's OS libraries, so a cache hit skips
      # them entirely. Playwright has no verify-deps-only mode; this reinstalls just that layer.
      - name: Install Playwright OS dependencies
        run: pnpm --filter @docket/web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Wait for the stack
        run: |
          for _ in $(seq 1 60); do
            web=$(curl -s -o /dev/null -w "%{http_code}" http://docket.localhost:3000/sign-in || true)
            api=$(curl -s -o /dev/null -w "%{http_code}" http://api.docket.localhost:4000/v1/health || true)
            oidc=$(curl -s -o /dev/null -w "%{http_code}" http://api.docket.localhost:4000/api/auth/.well-known/oauth-authorization-server || true)
            echo "web=$web api=$api oidc=$oidc"
            if [ "$web" = "200" ] && [ "$api" = "200" ] && [ "$oidc" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "stack never became ready" >&2
          tail -50 /tmp/web.log /tmp/api.log >&2
          exit 1

      - run: pnpm --filter @docket/web exec playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}

      # `always()`, not `failure()`: a shard that runs out of wall-clock is cancelled rather than
      # failed, and that is the case with the least other evidence. Both steps only report.
      - name: Server logs
        if: always()
        run: tail -n 100 -- /tmp/web.log /tmp/api.log || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
          if-no-files-found: ignore
