# Post-deployment confirmation that the documentation site is reachable on the product domain.
#
# `/docs` is not a route in `apps/web`. It resolves only through the `next.config.ts` rewrites to
# `DOCS_MINTLIFY_ORIGIN`, so its availability is a deployment fact no test in CI can hold: both
# branches of `docsRewrites()` are covered and both stayed green for weeks while the configured
# origin pointed at a hostname with no DNS record, and every `/docs` page answered
# `502 BAD_GATEWAY` on the live domain. Only a request to the running site can tell the difference.
#
# This is NOT a release gate and cannot be one: Vercel promotes the web build only after the
# `deploy-api` check passes (docs/engineering/deployment.md), so the thing being verified does not
# exist until the release is already out. It runs afterwards and reports loudly instead — a
# failure here is a red run and a broken site, not a blocked deploy.
#
# Billed footprint: one `ubuntu-latest` runner that makes roughly a dozen HTTP requests and exits.
# Two triggers, both cheap. `workflow_call` adds one run per production release, which is at most
# one per push to main. `schedule` adds exactly one run per day, and it is the trigger that earns
# its keep: the outage above was caused by a project-configuration change rather than a commit, so
# a release-only check would have stayed silent until whenever someone next pushed. There is no
# `push`/`pull_request` trigger, so branch and pull-request traffic costs nothing.
name: Verify docs

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      refresh_dependency_lock:
        description: Propose a registry lock without documentation probes or deployment
        type: boolean
        default: false
  schedule:
    # 14:00 UTC daily — mid-morning US Central, so a failure is seen the day it appears.
    - cron: '0 14 * * *'

# One at a time. A scheduled run overlapping a release-triggered run would probe the same origin
# twice for no added signal, and cancelling the in-flight one could discard a real failure.
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_dependency_lock == true && format('registry-lock-{0}', github.ref) || 'verify-docs' }}
  cancel-in-progress: false

jobs:
  verify-docs:
    name: Verify documentation site
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.refresh_dependency_lock == true) }}
    runs-on: ubuntu-latest
    # Backstop, not the expected duration: a healthy site settles on the first probe in seconds, and
    # the retry loop's own ceiling is four and a half minutes. This bounds the billed cost of a
    # verifier that stops making progress rather than letting it run to the six-hour default.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # The verifier reads only node builtins and `fetch`, so the root workspace carries
      # everything it needs — `tsx` to run it and nothing else.
      - uses: ./.github/actions/setup
        with:
          filter: '--filter @docket/root'

      # Gates on the documentation checks and reports the rest of the public production surface
      # advisorily. Deliberately no `continue-on-error` and no `|| true`: a documentation failure
      # must turn this run red.
      - name: Verify the documentation site is live
        run: pnpm launch:verify-docs

  dependency-lock:
    name: Propose private registry lock
    # Only an explicit dispatch of this reviewed same-repository compatibility branch.
    # No provider/environment access or production probes run in this job.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_dependency_lock == true && github.repository == 'TheHypertextStudio/athena-web' && github.ref == 'refs/heads/codex/docket-workers-compat' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.20.0'
          package-manager-cache: false
      - name: Enable declared exact pnpm
        shell: bash
        run: |
          package_manager=$(node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("package.json", "utf8")).packageManager; if (value !== "pnpm@11.9.0") throw new Error("Reviewed pnpm 11.9.0 required"); process.stdout.write(value);')
          corepack enable
          corepack prepare "$package_manager" --activate
          test "$(node --version)" = 'v24.20.0'
          test "$(pnpm --version)" = '11.9.0'
      - name: Resolve and validate proposed lock
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          registry_config=$(mktemp "$RUNNER_TEMP/docket-registry.XXXXXX")
          trap 'rm -f "$registry_config"' EXIT
          chmod 600 "$registry_config"
          # Keep the placeholder literal; pnpm expands it from trusted user config.
          # shellcheck disable=SC2016
          printf '%s\n' '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}' > "$registry_config"
          export NPM_CONFIG_USERCONFIG="$registry_config"
          # Fresh resolution only in this disposable checkout; never auto-adopt this lock.
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm peers check
          git diff --exit-code -- . ':!pnpm-lock.yaml'
      - name: Record source and lock provenance
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          const result = {
            repository: process.env.GITHUB_REPOSITORY,
            sourceSha: process.env.GITHUB_SHA,
            sourceRef: process.env.GITHUB_REF,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            node: process.version,
            pnpm: execFileSync('pnpm', ['--version'], { encoding: 'utf8' }).trim(),
            lockSha256: crypto.createHash('sha256').update(fs.readFileSync('pnpm-lock.yaml')).digest('hex'),
            acceptance: ['fresh registry resolution', 'script-disabled frozen install', 'peer check', 'other tracked source unchanged'],
          };
          const artifactDirectory = `${process.env.RUNNER_TEMP}/docket-registry-lock`;
          fs.mkdirSync(artifactDirectory, { recursive: true });
          fs.copyFileSync('pnpm-lock.yaml', `${artifactDirectory}/pnpm-lock.yaml`);
          fs.writeFileSync(`${artifactDirectory}/provenance.json`, JSON.stringify(result, null, 2) + '\n');
          NODE
      - name: Retain proposed lock for source review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-lock-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/docket-registry-lock/pnpm-lock.yaml
            ${{ runner.temp }}/docket-registry-lock/provenance.json
          if-no-files-found: error
          retention-days: 7
