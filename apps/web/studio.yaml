schema: 1
product: docket-website
repository: TheHypertextStudio/athena-web
owner_repository: TheHypertextStudio/athena-web
toolchain:
  python: '>=3.11'
  node: '24.20.0'
  pnpm: '11.9.0'
  wrangler: '4.148.0'
components:
  - id: website
    kind: static-site
    path: .
    checks:
      - name: Frontend typecheck and lint
        argv: [pnpm, --dir, ../.., exec, turbo, run, typecheck, lint, --filter, '@docket/web']
      - name: Frontend compatibility
        argv: [pnpm, test:workers:source]
      - name: Mintlify source
        argv: [pnpm, --dir, ../.., docs:check]
    dev: [pnpm, dev]
    build:
      script: build:worker:shipping
      output: .artifact
    deploy:
      provider: workers
      account_id: '2500680a3b2b0fe6a011c1c25fed5008'
      config: wrangler.site.jsonc
      entrypoint: worker.js
      assets: .open-next/assets
      opennext_cache:
        directory: .open-next/cache
      environments:
        staging: staging
        production: production
      health_urls:
        staging: https://docket-staging.hypertext.studio/__studio/release
        production: https://clearthedocket.com/__studio/release
# Proposed resources are not provisioned. Candidate activation remains default-off;
# promotion has a literal false guard until production bindings and recovery are reviewed.
# Empty channels do not disable static-site provider operations in the shared engine.
release:
  channels: []
  next_version: 0.1.0
  required_checks: [Frontend typecheck and lint, Frontend compatibility, Mintlify source]
  required_evidence:
    - staging-journeys
    - staging-auth-isolation
    - workers-runtime
    - production-configuration
    - production-recovery
    - public-identity
